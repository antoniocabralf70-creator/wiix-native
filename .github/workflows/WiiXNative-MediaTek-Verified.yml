name: Build WiiXNative MediaTek Edition

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative APK (MediaTek & Mali Optimized)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config nasm zip unzip curl tar \
            python3 python3-pip libx11-dev libwayland-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone Cemu Android Source
        shell: bash
        run: |
          rm -rf cemu_src
          git clone --recursive --depth 1 https://github.com/Producdevity/Cemu-Android.git cemu_src

      - name: Apply MediaTek & Mali Performance Tweaks
        shell: bash
        run: |
          cd cemu_src
          if [ -f "src/android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = [0-9]*/minSdk = 28/g' src/android/app/build.gradle.kts || true
          fi
          if [ -f "src/android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<application/<application android:isGame="true" android:largeHeap="true"/g' src/android/app/src/main/AndroidManifest.xml || true
          fi
          if [ -f "src/android/app/src/main/res/values/strings.xml" ]; then
            sed -i 's/>Cemu</>WiiXNative</g' src/android/app/src/main/res/values/strings.xml || true
          fi

      - name: Build Release APK (arm64-v8a)
        shell: bash
        env:
          CFLAGS: "-O3 -march=armv8.2-a+dotprod+fp16+crypto -ffast-math"
          CXXFLAGS: "-O3 -march=armv8.2-a+dotprod+fp16+crypto -ffast-math"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          cd cemu_src/src/android
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Sign & Align APK
        shell: bash
        run: |
          APK_PATH=$(find cemu_src/src/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: Nenhum APK foi gerado."
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WiiXNative,O=Android,C=BR"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK_PATH" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out WiiXNative-MediaTek-arm64.apk aligned.apk

      - name: Upload WiiXNative APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-MediaTek-APK
          path: WiiXNative-MediaTek-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-BuildLog
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
