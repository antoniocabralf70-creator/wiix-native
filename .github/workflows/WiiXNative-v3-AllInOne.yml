              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF090E17"/>
                          <item android:offset="0.5" android:color="#FF0F1C2E"/>
                          <item android:offset="1.0" android:color="#FF071926"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <!-- Grade sutil estilo console -->
              <path android:strokeColor="#1400E5FF" android:strokeWidth="1" android:pathData="M0,27h108 M0,54h108 M0,81h108 M27,0v108 M54,0v108 M81,0v108"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Sombra do Controle -->
              <path
                  android:fillColor="#55000000"
                  android:pathData="M24,35 L84,35 C92,35 97,41 97,50 L95,68 C94,75 88,80 81,79 L72,76 L36,76 L27,79 C20,80 14,75 13,68 L11,50 C11,41 16,35 24,35 Z"/>
              <!-- Corpo Principal do GamePad -->
              <path
                  android:fillColor="#FF1C2536"
                  android:strokeColor="#FF00E5FF"
                  android:strokeWidth="2.2"
                  android:pathData="M24,33 L84,33 C92,33 97,39 97,48 L95,66 C94,73 88,78 81,77 L72,74 L36,74 L27,77 C20,78 14,73 13,66 L11,48 C11,39 16,33 24,33 Z"/>
              <!-- Tela Central do Emulador -->
              <path
                  android:fillColor="#FF07131E"
                  android:strokeColor="#FF00B0FF"
                  android:strokeWidth="1.2"
                  android:pathData="M37,39 L71,39 C72.5,39 73.5,40 73.5,41.5 L73.5,64.5 C73.5,66 72.5,67 71,67 L37,67 C35.5,67 34.5,66 34.5,64.5 L34.5,41.5 C34.5,40 35.5,39 37,39 Z"/>
              <!-- Brilho/Play dentro da tela -->
              <path
