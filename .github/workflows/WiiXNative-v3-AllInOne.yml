          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("wiixnative")

          add_library(wiixnative SHARED wiixnative.cpp)

          find_library(log-lib log)
          find_library(android-lib android)
          find_library(egl-lib EGL)
          find_library(gles-lib GLESv3)

          target_link_libraries(wiixnative
              ${log-lib}
              ${android-lib}
              ${egl-lib}
              ${gles-lib}
              dl)
          EOF

          cat << 'EOF' > app/src/main/cpp/wiixnative.cpp
          #include <jni.h>
          #include <android/native_window_jni.h>
          #include <android/log.h>
          #include <dlfcn.h>
          #include <string>
          #include <atomic>
          #include <thread>
          #include <chrono>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>

          #define LOG_TAG "WiiXNativeCore"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static ANativeWindow* g_window = nullptr;
          static std::atomic<bool> g_running{false};
          static std::thread g_emuThread;
          static int g_gfxApi = 1; // 0 = OpenGL ES, 1 = Vulkan
          static std::string g_customDriverPath = "";
          static std::string g_gamePath = "";
          static void* g_driverHandle = nullptr;

          static std::atomic<uint32_t> g_buttonMask{0};
          static std::atomic<float> g_leftStickX{0.0f};
          static std::atomic<float> g_leftStickY{0.0f};
          static std::atomic<float> g_rightStickX{0.0f};
          static std::atomic<float> g_rightStickY{0.0f};

          void LoadCustomVulkanDriver(const std::string& path) {
              if (g_driverHandle) {
                  dlclose(g_driverHandle);
                  g_driverHandle = nullptr;
              }
              if (path.empty()) return;
              g_driverHandle = dlopen(path.c_str(), RTLD_NOW | RTLD_LOCAL);
              if (g_driverHandle) {
                  LOGI("Driver Vulkan personalizado carregado: %s", path.c_str());
              } else {
                  LOGE("Falha ao carregar driver (%s): %s", path.c_str(), dlerror());
              }
          }

          void EmulationLoop() {
              LOGI("Iniciando loop nativo WiiXNative | API: %s | Jogo: %s",
                   g_gfxApi == 1 ? "Vulkan" : "OpenGL ES 3.2", g_gamePath.c_str());

              if (g_gfxApi == 1 && !g_customDriverPath.empty()) {
                  LoadCustomVulkanDriver(g_customDriverPath);
              }

              EGLDisplay display = EGL_NO_DISPLAY;
              EGLSurface surface = EGL_NO_SURFACE;
              EGLContext context = EGL_NO_CONTEXT;

              if (g_window) {
                  display = eglGetDisplay(EGL_DEFAULT_DISPLAY);
                  eglInitialize(display, nullptr, nullptr);
                  const EGLint attribs[] = {
                      EGL_RENDERABLE_TYPE, EGL_OPENGL_ES3_BIT,
                      EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                      EGL_BLUE_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_RED_SIZE, 8,
                      EGL_NONE
                  };
                  EGLConfig config;
                  EGLint numConfigs;
                  eglChooseConfig(display, attribs, &config, 1, &numConfigs);
                  surface = eglCreateWindowSurface(display, config, g_window, nullptr);
                  const EGLint ctxAttribs[] = { EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE };
                  context = eglCreateContext(display, config, EGL_NO_CONTEXT, ctxAttribs);
                  eglMakeCurrent(display, surface, surface, context);
              }

              float pulse = 0.0f;
              while (g_running) {
                  pulse += 0.03f;
                  uint32_t btns = g_buttonMask.load();
                  float lx = g_leftStickX.load();
                  float ly = g_leftStickY.load();

                  if (display != EGL_NO_DISPLAY && surface != EGL_NO_SURFACE) {
                      float r = (btns > 0) ? 0.14f : (0.04f + 0.03f * sinf(pulse));
                      float g = 0.09f + fabsf(lx) * 0.18f;
                      float b = (g_gfxApi == 1) ? (0.24f + fabsf(ly) * 0.22f) : 0.16f;
                      glClearColor(r, g, b, 1.0f);
                      glClear(GL_COLOR_BUFFER_BIT);
                      eglSwapBuffers(display, surface);
                  }
                  std::this_thread::sleep_for(std::chrono::milliseconds(16));
              }

              if (display != EGL_NO_DISPLAY) {
                  eglMakeCurrent(display, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (context != EGL_NO_CONTEXT) eglDestroyContext(display, context);
                  if (surface != EGL_NO_SURFACE) eglDestroySurface(display, surface);
                  eglTerminate(display);
              }
              LOGI("Loop de emulação finalizado.");
          }

          extern "C" {

          JNIEXPORT void JNICALL
          Java_com_wiixnative_emu_NativeBridge_setGraphicsConfig(JNIEnv* env, jobject, jint api, jstring driverPath) {
              g_gfxApi = api;
              const char* pathChars = env->GetStringUTFChars(driverPath, nullptr);
              g_customDriverPath = pathChars ? pathChars : "";
              env->ReleaseStringUTFChars(driverPath, pathChars);
          }

          JNIEXPORT void JNICALL
          Java_com_wiixnative_emu_NativeBridge_startGame(JNIEnv* env, jobject, jobject surface, jstring gamePath) {
              if (g_running) {
                  g_running = false;
                  if (g_emuThread.joinable()) g_emuThread.join();
              }
              if (g_window) {
                  ANativeWindow_release(g_window);
                  g_window = nullptr;
              }
              if (surface) {
                  g_window = ANativeWindow_fromSurface(env, surface);
              }
              const char* gameChars = env->GetStringUTFChars(gamePath, nullptr);
              g_gamePath = gameChars ? gameChars : "";
              env->ReleaseStringUTFChars(gamePath, gameChars);

              g_running = true;
              g_emuThread = std::thread(EmulationLoop);
          }

          JNIEXPORT void JNICALL
          Java_com_wiixnative_emu_NativeBridge_stopGame(JNIEnv*, jobject) {
              g_running = false;
              if (g_emuThread.joinable()) g_emuThread.join();
              if (g_window) {
                  ANativeWindow_release(g_window);
                  g_window = nullptr;
              }
          }

          JNIEXPORT void JNICALL
          Java_com_wiixnative_emu_NativeBridge_updateInput(JNIEnv*, jobject, jint mask, jfloat lx, jfloat ly, jfloat rx, jfloat ry) {
              g_buttonMask = static_cast<uint32_t>(mask);
              g_leftStickX = lx;
              g_leftStickY = ly;
              g_rightStickX = rx;
              g_rightStickY = ry;
          }

          }
          EOF

          cat << 'EOF' > app/src/main/java/com/wiixnative/emu/NativeBridge.kt
          package com.wiixnative.emu

          import android.view.Surface

          object NativeBridge {
              init {
                  System.loadLibrary("wiixnative")
              }

              external fun setGraphicsConfig(api: Int, driverPath: String)
              external fun startGame(surface: Surface?, gamePath: String)
              external fun stopGame()
              external fun updateInput(mask: Int, lx: Float, ly: Float, rx: Float, ry: Float)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/wiixnative/emu/VirtualGamepadOverlay.kt
          package com.wiixnative.emu

          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot
          import kotlin.math.min

          class VirtualGamepadOverlay(context: Context) : View(context) {

              private data class VButton(val id: Int, val label: String, var cx: Float = 0f, var cy: Float = 0f, var r: Float = 0f, var pressed: Boolean = false)

              private val buttons = listOf(
                  VButton(1 shl 0, "A"),
                  VButton(1 shl 1, "B"),
                  VButton(1 shl 2, "X"),
                  VButton(1 shl 3, "Y"),
                  VButton(1 shl 4, "UP"),
                  VButton(1 shl 5, "DN"),
                  VButton(1 shl 6, "LT"),
                  VButton(1 shl 7, "RT"),
                  VButton(1 shl 8, "L"),
                  VButton(1 shl 9, "R"),
                  VButton(1 shl 10, "ZL"),
                  VButton(1 shl 11, "ZR"),
                  VButton(1 shl 12, "+"),
                  VButton(1 shl 13, "-")
              )

              private var lStickBaseX = 0f
              private var lStickBaseY = 0f
              private var lStickKnobX = 0f
              private var lStickKnobY = 0f
              private var lStickRadius = 0f
              private var lStickPointer = -1

              private var rStickBaseX = 0f
              private var rStickBaseY = 0f
              private var rStickKnobX = 0f
              private var rStickKnobY = 0f
              private var rStickRadius = 0f
              private var rStickPointer = -1

              private val basePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(65, 255, 255, 255)
                  style = Paint.Style.FILL
              }
              private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(165, 0, 229, 255)
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }
              private val pressedPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(165, 0, 229, 255)
                  style = Paint.Style.FILL
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  val unit = min(w, h) * 0.068f
                  textPaint.textSize = unit * 0.65f

                  lStickRadius = unit * 1.45f
                  lStickBaseX = w * 0.13f
                  lStickBaseY = h * 0.38f
                  lStickKnobX = lStickBaseX
                  lStickKnobY = lStickBaseY

                  rStickRadius = unit * 1.45f
                  rStickBaseX = w * 0.87f
                  rStickBaseY = h * 0.38f
                  rStickKnobX = rStickBaseX
                  rStickKnobY = rStickBaseY

                  val dpadX = w * 0.15f
                  val dpadY = h * 0.75f
                  val dOff = unit * 1.35f
                  buttons[4].apply { cx = dpadX; cy = dpadY - dOff; r = unit * 0.85f }
                  buttons[5].apply { cx = dpadX; cy = dpadY + dOff; r = unit * 0.85f }
                  buttons[6].apply { cx = dpadX - dOff; cy = dpadY; r = unit * 0.85f }
                  buttons[7].apply { cx = dpadX + dOff; cy = dpadY; r = unit * 0.85f }

                  val abxyX = w * 0.85f
                  val abxyY = h * 0.75f
                  buttons[2].apply { cx = abxyX; cy = abxyY - dOff; r = unit * 0.9f }
                  buttons[1].apply { cx = abxyX; cy = abxyY + dOff; r = unit * 0.9f }
                  buttons[3].apply { cx = abxyX - dOff; cy = abxyY; r = unit * 0.9f }
                  buttons[0].apply { cx = abxyX + dOff; cy = abxyY; r = unit * 0.9f }

                  buttons[10].apply { cx = w * 0.08f; cy = h * 0.12f; r = unit * 0.9f }
                  buttons[8].apply  { cx = w * 0.19f; cy = h * 0.12f; r = unit * 0.9f }
                  buttons[9].apply  { cx = w * 0.81f; cy = h * 0.12f; r = unit * 0.9f }
                  buttons[11].apply { cx = w * 0.92f; cy = h * 0.12f; r = unit * 0.9f }

                  buttons[13].apply { cx = w * 0.43f; cy = h * 0.90f; r = unit * 0.75f }
                  buttons[12].apply { cx = w * 0.57f; cy = h * 0.90f; r = unit * 0.75f }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawCircle(lStickBaseX, lStickBaseY, lStickRadius, basePaint)
                  canvas.drawCircle(lStickBaseX, lStickBaseY, lStickRadius, strokePaint)
                  canvas.drawCircle(lStickKnobX, lStickKnobY, lStickRadius * 0.48f, pressedPaint)

                  canvas.drawCircle(rStickBaseX, rStickBaseY, rStickRadius, basePaint)
                  canvas.drawCircle(rStickBaseX, rStickBaseY, rStickRadius, strokePaint)
                  canvas.drawCircle(rStickKnobX, rStickKnobY, rStickRadius * 0.48f, pressedPaint)

                  for (b in buttons) {
                      canvas.drawCircle(b.cx, b.cy, b.r, if (b.pressed) pressedPaint else basePaint)
                      canvas.drawCircle(b.cx, b.cy, b.r, strokePaint)
                      canvas.drawText(b.label, b.cx, b.cy + textPaint.textSize * 0.35f, textPaint)
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val action = event.actionMasked
                  val index = event.actionIndex
                  val pointerId = event.getPointerId(index)

                  when (action) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val x = event.getX(index)
                          val y = event.getY(index)
                          if (hypot(x - lStickBaseX, y - lStickBaseY) <= lStickRadius * 1.4f && lStickPointer == -1) {
                              lStickPointer = pointerId
                              updateStick(true, x, y)
                          } else if (hypot(x - rStickBaseX, y - rStickBaseY) <= rStickRadius * 1.4f && rStickPointer == -1) {
                              rStickPointer = pointerId
                              updateStick(false, x, y)
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until event.pointerCount) {
                              val pId = event.getPointerId(i)
                              if (pId == lStickPointer) updateStick(true, event.getX(i), event.getY(i))
                              if (pId == rStickPointer) updateStick(false, event.getX(i), event.getY(i))
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          if (pointerId == lStickPointer) {
                              lStickPointer = -1
                              lStickKnobX = lStickBaseX
                              lStickKnobY = lStickBaseY
                          }
                          if (pointerId == rStickPointer) {
                              rStickPointer = -1
                              rStickKnobX = rStickBaseX
                              rStickKnobY = rStickBaseY
                          }
                      }
                  }

                  var mask = 0
                  for (b in buttons) {
                      b.pressed = false
                      for (i in 0 until event.pointerCount) {
                          val pId = event.getPointerId(i)
                          if ((action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP) && pId == pointerId) continue
                          if (hypot(event.getX(i) - b.cx, event.getY(i) - b.cy) <= b.r * 1.2f) {
                              b.pressed = true
                              mask = mask or b.id
                          }
                      }
                  }

                  val lx = (lStickKnobX - lStickBaseX) / lStickRadius
                  val ly = (lStickKnobY - lStickBaseY) / lStickRadius
                  val rx = (rStickKnobX - rStickBaseX) / rStickRadius
                  val ry = (rStickKnobY - rStickBaseY) / rStickRadius
                  NativeBridge.updateInput(mask, lx, ly, rx, ry)

                  invalidate()
                  return true
              }

              private fun updateStick(isLeft: Boolean, x: Float, y: Float) {
                  val bx = if (isLeft) lStickBaseX else rStickBaseX
                  val by = if (isLeft) lStickBaseY else rStickBaseY
                  val rad = if (isLeft) lStickRadius else rStickRadius
                  val dx = x - bx
                  val dy = y - by
                  val dist = hypot(dx, dy)
                  val clamped = min(dist, rad)
                  val ratio = if (dist > 0f) clamped / dist else 0f
                  if (isLeft) {
                      lStickKnobX = bx + dx * ratio
                      lStickKnobY = by + dy * ratio
                  } else {
                      rStickKnobX = bx + dx * ratio
                      rStickKnobY = by + dy * ratio
                  }
              }
          }
