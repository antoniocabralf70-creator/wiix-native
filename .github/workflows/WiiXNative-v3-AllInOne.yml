              <!-- Analógico Esquerdo -->
              <path
                  android:fillColor="#FF2E3B52"
                  android:strokeColor="#FF00E5FF"
                  android:strokeWidth="1"
                  android:pathData="M23,41 A4.5,4.5 0 1,1 22.9,41 Z"/>
              <!-- D-Pad Esquerdo -->
              <path
                  android:fillColor="#FFB0BEC5"
                  android:pathData="M21.5,53 H24.5 V56.5 H28 V59.5 H24.5 V63 H21.5 V59.5 H18 V56.5 H21.5 Z"/>
              <!-- Analógico Direito -->
              <path
                  android:fillColor="#FF2E3B52"
                  android:strokeColor="#FF00E5FF"
                  android:strokeWidth="1"
                  android:pathData="M85,41 A4.5,4.5 0 1,1 84.9,41 Z"/>
              <!-- Botões A B X Y Coloridos -->
              <path android:fillColor="#FF00E676" android:pathData="M85,51.5 A2,2 0 1,1 84.9,51.5 Z"/>
              <path android:fillColor="#FFFF5252" android:pathData="M89.5,56 A2,2 0 1,1 89.4,56 Z"/>
              <path android:fillColor="#FFFFD740" android:pathData="M85,60.5 A2,2 0 1,1 84.9,60.5 Z"/>
              <path android:fillColor="#FF40C4FF" android:pathData="M80.5,56 A2,2 0 1,1 80.4,56 Z"/>
