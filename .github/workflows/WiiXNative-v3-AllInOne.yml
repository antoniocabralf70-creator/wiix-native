              private fun scanGamesFromFolder(treeUri: Uri) {
                  val rootDoc = DocumentFile.fromTreeUri(this, treeUri) ?: return
                  folderPathText.text = "Pasta: ${rootDoc.name ?: treeUri.lastPathSegment}"
                  statusText.text = "Escaneando jogos e capas na pasta..."
                  scannedGames.clear()
                  gameGridLayout.removeAllViews()

                  Thread {
                      val found = mutableListOf<GameEntry>()
                      val children = rootDoc.listFiles()

                      for (doc in children) {
                          val name = doc.name ?: continue
                          if (doc.isFile) {
                              val lower = name.lowercase()
                              if (lower.endsWith(".wux") || lower.endsWith(".wud") || lower.endsWith(".rpx") || lower.endsWith(".wua")) {
                                  val cleanTitle = name.substringBeforeLast(".")
                                  val ext = name.substringAfterLast(".").uppercase()
                                  val cover = findExternalCover(children, cleanTitle) ?: generateGameBoxArt(cleanTitle, ext)
                                  found.add(GameEntry(cleanTitle, ext, doc.uri, cover))
                              }
                          } else if (doc.isDirectory) {
                              // Suporte a jogos em pasta formato Loadiine (contendo subpastas code/content/meta)
                              val subFiles = doc.listFiles()
                              val metaDir = subFiles.firstOrNull { it.isDirectory && it.name.equals("meta", ignoreCase = true) }
                              val codeDir = subFiles.firstOrNull { it.isDirectory && it.name.equals("code", ignoreCase = true) }
                              if (metaDir != null || codeDir != null) {
                                  val rpxFile = codeDir?.listFiles()?.firstOrNull { it.name?.lowercase()?.endsWith(".rpx") == true }
                                  val targetUri = rpxFile?.uri ?: doc.uri
                                  val cover = loadMetaCover(metaDir) ?: findExternalCover(children, name) ?: generateGameBoxArt(name, "Wii U Folder")
                                  found.add(GameEntry(name, "LOADIINE", targetUri, cover))
                              }
                          }
                      }

                      runOnUiThread {
                          scannedGames.addAll(found.sortedBy { it.title })
                          if (scannedGames.isEmpty()) {
                              statusText.text = "Nenhum jogo encontrado nesta pasta. Coloque arquivos .wux, .wud, .rpx ou pastas com meta/code."
                          } else {
                              statusText.text = "${scannedGames.size} jogo(s) encontrado(s) — toque na capa para iniciar"
                          }
                          renderGameCards()
                      }
                  }.start()
              }

              private fun loadMetaCover(metaDir: DocumentFile?): Bitmap? {
                  if (metaDir == null) return null
                  val files = metaDir.listFiles()
                  // Procura bootTvTex.png, iconTex.png ou qualquer .png/.jpg dentro de meta/
                  val preferred = listOf("bootTvTex.png", "bootDrcTex.png", "iconTex.png")
                  for (p in preferred) {
                      val match = files.firstOrNull { it.name.equals(p, ignoreCase = true) }
                      if (match != null) {
                          decodeBitmapFromUri(match.uri)?.let { return it }
                      }
                  }
                  val anyImg = files.firstOrNull {
                      val n = it.name?.lowercase() ?: ""
                      n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg")
                  }
                  return anyImg?.let { decodeBitmapFromUri(it.uri) }
              }

              private fun findExternalCover(siblings: Array<DocumentFile>, baseName: String): Bitmap? {
                  val match = siblings.firstOrNull {
                      val n = it.name ?: ""
                      val lower = n.lowercase()
                      (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg")) &&
                          n.substringBeforeLast(".").equals(baseName, ignoreCase = true)
                  }
                  return match?.let { decodeBitmapFromUri(it.uri) }
              }

              private fun decodeBitmapFromUri(uri: Uri): Bitmap? {
                  return try {
                      contentResolver.openInputStream(uri)?.use { stream ->
                          BitmapFactory.decodeStream(stream)
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              // Gera uma capa estilo caixa oficial do Wii U caso o arquivo não tenha imagem externa
              private fun generateGameBoxArt(title: String, format: String): Bitmap {
                  val w = 360
                  val h = 210
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)

                  val hash = abs(title.hashCode())
                  val palettes = listOf(
                      intArrayOf(Color.parseColor("#0D47A1"), Color.parseColor("#00ACC1")),
                      intArrayOf(Color.parseColor("#1B5E20"), Color.parseColor("#00BFA5")),
                      intArrayOf(Color.parseColor("#4A148C"), Color.parseColor("#2979FF")),
                      intArrayOf(Color.parseColor("#BF360C"), Color.parseColor("#FF9100")),
                      intArrayOf(Color.parseColor("#004D40"), Color.parseColor("#00E5FF"))
                  )
                  val pal = palettes[hash % palettes.size]

                  val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(0f, 0f, w.toFloat(), h.toFloat(), pal[0], pal[1], Shader.TileMode.CLAMP)
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), bgPaint)

                  // Faixa superior azul estilo capa Wii U
                  val topBar = Paint().apply { color = Color.parseColor("#0091EA") }
                  canvas.drawRect(0f, 0f, w.toFloat(), 34f, topBar)

                  val headerPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  canvas.drawText("Wii U  •  $format", 14f, 23f, headerPaint)

                  // Sombra escura na parte inferior para leitura do título
                  val shadePaint = Paint().apply {
                      shader = LinearGradient(0f, 70f, 0f, h.toFloat(), Color.TRANSPARENT, Color.argb(215, 5, 10, 18), Shader.TileMode.CLAMP)
                  }
                  canvas.drawRect(0f, 70f, w.toFloat(), h.toFloat(), shadePaint)

                  val titlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 24f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val shortTitle = if (title.length > 24) title.take(22) + "..." else title
                  canvas.drawText(shortTitle, 16f, h - 24f, titlePaint)

                  return bmp
              }

              private fun renderGameCards() {
                  gameGridLayout.removeAllViews()
                  val d = resources.displayMetrics.density

                  // Exibe em grade de 2 colunas com imagem de capa
                  var rowLayout: LinearLayout? = null
                  scannedGames.forEachIndexed { index, game ->
                      if (index % 2 == 0) {
                          rowLayout = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                          }
                          val rowLp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              bottomMargin = (10 * d).toInt()
                          }
                          gameGridLayout.addView(rowLayout, rowLp)
                      }

                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = cardBg("#162133", "#263B59", 12f)
                          setPadding((8 * d).toInt(), (8 * d).toInt(), (8 * d).toInt(), (8 * d).toInt())
                          isClickable = true
                          isFocusable = true
                          setOnClickListener { launchGame(game) }
                      }

                      val coverImg = ImageView(this).apply {
                          setImageBitmap(game.coverBitmap)
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          background = cardBg("#0A0F18", "#00E5FF", 8f)
                          clipToOutline = true
                      }
                      card.addView(coverImg, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (96 * d).toInt()))

                      val nameTv = TextView(this).apply {
                          text = game.title
                          textSize = 13f
                          setTextColor(Color.WHITE)
                          typeface = Typeface.DEFAULT_BOLD
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                          setPadding(0, (6 * d).toInt(), 0, (2 * d).toInt())
                      }
                      card.addView(nameTv)

                      val subTv = TextView(this).apply {
                          text = "Formato: ${game.format}  •  ▶ Jogar"
                          textSize = 11f
                          setTextColor(Color.parseColor("#00E5FF"))
                      }
                      card.addView(subTv)

                      val cardLp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          if (index % 2 == 0) marginEnd = (8 * d).toInt()
                      }
                      rowLayout?.addView(card, cardLp)
                  }

                  // Se for número ímpar de jogos, adiciona espaço vazio na direita para alinhar a grade
                  if (scannedGames.size % 2 == 1) {
                      val spacer = View(this)
                      rowLayout?.addView(spacer, LinearLayout.LayoutParams(0, 1, 1f))
                  }
              }

              private fun installCustomDriver(uri: Uri) {
                  try {
                      val driverDir = File(filesDir, "custom_drivers").apply { mkdirs() }
                      driverDir.listFiles()?.forEach { it.delete() }

                      var foundSo: File? = null
                      contentResolver.openInputStream(uri)?.use { input ->
                          val tempFile = File(cacheDir, "driver_import.tmp")
                          FileOutputStream(tempFile).use { out -> input.copyTo(out) }

                          if (tempFile.readBytes().take(2) == listOf(0x50.toByte(), 0x4B.toByte())) {
                              ZipInputStream(tempFile.inputStream()).use { zis ->
                                  var entry = zis.nextEntry
                                  while (entry != null) {
                                      if (!entry.isDirectory && entry.name.endsWith(".so")) {
                                          val outSo = File(driverDir, File(entry.name).name)
                                          FileOutputStream(outSo).use { out -> zis.copyTo(out) }
                                          if (outSo.name.contains("vulkan", ignoreCase = true) || foundSo == null) {
                                              foundSo = outSo
                                          }
                                      }
                                      entry = zis.nextEntry
                                  }
                              }
                          } else {
                              val outSo = File(driverDir, "custom_vulkan_driver.so")
                              tempFile.copyTo(outSo, overwrite = true)
                              foundSo = outSo
                          }
                      }

                      if (foundSo != null) {
                          prefs.edit()
                              .putString("driver_path", foundSo!!.absolutePath)
                              .putString("driver_name", foundSo!!.name)
                              .apply()
                          driverNameText.text = foundSo!!.name
                          Toast.makeText(this, "Driver instalado: ${foundSo!!.name}", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Nenhum arquivo .so encontrado no pacote", Toast.LENGTH_SHORT).show()
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Erro ao importar driver: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun launchGame(game: GameEntry) {
                  isInGame = true
                  rootContainer.removeAllViews()

                  val api = prefs.getInt("gfx_api", 1)
                  val driverPath = prefs.getString("driver_path", "") ?: ""
                  NativeBridge.setGraphicsConfig(api, driverPath)

                  gameSurfaceView = SurfaceView(this).apply {
                      holder.addCallback(object : SurfaceHolder.Callback {
                          override fun surfaceCreated(holder: SurfaceHolder) {
                              NativeBridge.startGame(holder.surface, game.uri.toString())
                          }
                          override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
                          override fun surfaceDestroyed(holder: SurfaceHolder) {
                              NativeBridge.stopGame()
                          }
                      })
                  }
                  rootContainer.addView(gameSurfaceView)

                  if (prefs.getBoolean("show_overlay", true)) {
                      gamepadOverlay = VirtualGamepadOverlay(this)
                      rootContainer.addView(gamepadOverlay)
                  }

                  val d = resources.displayMetrics.density
                  val topHud = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding((12 * d).toInt(), (8 * d).toInt(), (12 * d).toInt(), (8 * d).toInt())
                  }
                  val hudLabel = TextView(this).apply {
                      val apiName = if (api == 1) "Vulkan" else "OpenGL"
                      text = "${game.title}  •  $apiName"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(145, 10, 15, 24))
                      setPadding((10 * d).toInt(), (4 * d).toInt(), (10 * d).toInt(), (4 * d).toInt())
                  }
                  val exitBtn = Button(this).apply {
                      text = "Sair"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(190, 211, 47, 47))
                      setOnClickListener {
                          NativeBridge.stopGame()
                          buildLauncherUI()
                      }
                  }
                  topHud.addView(hudLabel)
                  val exitLp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, (32 * d).toInt()).apply {
                      marginStart = (10 * d).toInt()
                  }
                  topHud.addView(exitBtn, exitLp)

                  val hudLp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  }
                  rootContainer.addView(topHud, hudLp)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (isInGame) {
                      NativeBridge.stopGame()
                      buildLauncherUI()
                  } else {
                      @Suppress("DEPRECATION")
                      super.onBackPressed()
                  }
              }
          }
