name: WiiXNative Build (Quick Test + Núcleo Otimizado)

on:
  workflow_dispatch:
    inputs:
      cpu_profile:
        description: "Perfil de CPU (MediaTek)"
        type: choice
        default: armv82
        options:
          - armv82   # Cortex-A75/A76/A55 (Helio G90+, Dimensity) - dotprod/fp16
          - armv8    # Seguro p/ qualquer arm64 (Cortex-A53 antigos, Helio P/G35)
      build_core:
        description: "Compilar o núcleo (APK) após o teste rápido"
        type: boolean
        default: true
  push:
    branches: [main, master]

concurrency:
  group: wiixnative-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  ANDROID_API: "34"
  CEMU_REPO: "https://github.com/Producdevity/Cemu-Android.git"

jobs:
  # ---------------------------------------------------------------
  # 1) Teste rápido: ambiente, SDK/NDK, acesso ao fonte e flags
  # ---------------------------------------------------------------
  quick-test:
    name: Quick Test (Ambiente, NDK e flags MediaTek)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cflags: ${{ steps.flags.outputs.cflags }}

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          java -version
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_API}.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verificar acesso ao repositório do Cemu Android
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote "$CEMU_REPO" HEAD
          echo "Conexão com o repositório Cemu Android OK!"

      - name: Definir flags do perfil de CPU
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.cpu_profile || 'armv82' }}"
          if [ "$PROFILE" = "armv82" ]; then
            ARCH="-march=armv8.2-a+dotprod+fp16+crypto -mtune=cortex-a76"
          else
            ARCH="-march=armv8-a+crc+crypto -mtune=cortex-a55"
          fi
          # Sem -ffast-math: quebra a precisão de ponto flutuante do PPC (paired singles)
          CFLAGS="-O3 $ARCH -fomit-frame-pointer -fno-semantic-interposition -flto=thin"
          echo "Perfil: $PROFILE"
          echo "Flags : $CFLAGS"
          echo "cflags=$CFLAGS" >> "$GITHUB_OUTPUT"

      - name: Testar compilação com as flags (NDK clang)
        shell: bash
        run: |
          set -euo pipefail
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          cat > test_mtk.cpp << 'EOF'
          #include <iostream>
          int main() {
              std::cout << "WiiXNative: flags MediaTek OK" << std::endl;
              return 0;
          }
          EOF
          # shellcheck disable=SC2086
          "$CLANG" ${{ steps.flags.outputs.cflags }} test_mtk.cpp -o test_mtk
          file test_mtk
          echo "Compilação de teste concluída com sucesso!"

  # ---------------------------------------------------------------
  # 2) Núcleo otimizado (libs nativas + APK) para MediaTek arm64
  # ---------------------------------------------------------------
  build-core:
    name: Build do Núcleo Otimizado (arm64-v8a)
    needs: quick-test
    if: ${{ github.event_name == 'push' || github.event.inputs.build_core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Liberar espaço em disco
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_API}.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Instalar ccache e ninja
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache ninja-build

      - name: Cache (ccache + Gradle)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: wiixnative-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/CMakeLists.txt') }}
          restore-keys: wiixnative-${{ runner.os }}-

      - name: Baixar código do Cemu Android (com submódulos)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules "$CEMU_REPO" cemu-android

      - name: Compilar núcleo otimizado + APK
        working-directory: cemu-android
        shell: bash
        env:
          # CMake lê CFLAGS/CXXFLAGS do ambiente na configuração inicial
          CFLAGS: ${{ needs.quick-test.outputs.cflags }}
          CXXFLAGS: ${{ needs.quick-test.outputs.cflags }}
          CCACHE_DIR: ~/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon --stacktrace
          ccache -s || true

      - name: Coletar artefatos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find cemu-android -name "*.apk" -path "*outputs*" -exec cp -v {} out/ \;
          find cemu-android -name "*.so" -path "*arm64-v8a*" -exec cp -v {} out/ \; || true
          ls -la out

      - name: Enviar APK e libs nativas
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-mtk-${{ github.event.inputs.cpu_profile || 'armv82' }}
          path: out/
          if-no-files-found: error
          retention-days: 14
