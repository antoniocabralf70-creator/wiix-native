              private fun scanGamesFromFolder(treeUri: Uri) {
                  statusText.text = "Escaneando pastas e subpastas..."
                  gameGridContainer.removeAllViews()

                  thread {
                      val rootDoc = DocumentFile.fromTreeUri(this, treeUri)
                      val foundGames = mutableListOf<GameEntry>()
                      if (rootDoc != null && rootDoc.isDirectory) {
                          scanDirectoryRecursive(rootDoc, foundGames, depth = 0, maxDepth = 4)
                      }

                      runOnUiThread {
                          if (foundGames.isEmpty()) {
                              statusText.text = "Nenhum jogo encontrado (.wux, .wud, .rpx, .wua ou pasta code/meta)"
                          } else {
                              statusText.text = "Biblioteca Wii U (${foundGames.size} jogos encontrados)"
                              for (game in foundGames) {
                                  addGameCard(game)
                              }
                          }
                      }
                  }
              }

              // Reconhecimento inteligente: suporta Loadiine (code+meta) e arquivos soltos em ate 4 niveis
              private fun scanDirectoryRecursive(
                  dir: DocumentFile,
                  results: MutableList<GameEntry>,
                  depth: Int,
                  maxDepth: Int
              ) {
                  if (depth > maxDepth) return
                  val children = dir.listFiles()

                  // 1. Verifica se esta pasta e um jogo Wii U extraido (contem subpasta 'code' e 'meta')
                  val codeDir = children.firstOrNull { it.isDirectory && it.name.equals("code", ignoreCase = true) }
                  val metaDir = children.firstOrNull { it.isDirectory && it.name.equals("meta", ignoreCase = true) }

                  if (codeDir != null) {
                      val rpxFile = codeDir.listFiles().firstOrNull {
                          it.isFile && (it.name?.endsWith(".rpx", true) == true || it.name?.endsWith(".elf", true) == true)
                      }
                      if (rpxFile != null) {
                          val realTitle = parseMetaXmlTitle(metaDir) ?: dir.name ?: "Jogo Wii U"
                          val coverBmp = loadCoverFromMeta(metaDir) ?: generateStylizedCover(realTitle, "LOADIINE")
                          results.add(GameEntry(realTitle, "RPX / Pasta", rpxFile.uri, coverBmp))
                          return // Nao precisa descer mais dentro deste jogo
                      }
                  }

                  // 2. Procura arquivos de imagem de disco (.wux, .wud, .wua, .rpx, .iso) e capas externas
                  val imageFiles = children.filter {
                      it.isFile && (it.name?.endsWith(".png", true) == true || it.name?.endsWith(".jpg", true) == true || it.name?.endsWith(".jpeg", true) == true)
                  }

                  for (child in children) {
                      if (child.isFile) {
                          val name = child.name ?: continue
                          val ext = name.substringAfterLast('.', "").lowercase()
                          if (ext in validExtensions) {
                              val cleanTitle = name.substringBeforeLast('.')
                              val matchingImg = imageFiles.firstOrNull {
                                  it.name?.substringBeforeLast('.')?.equals(cleanTitle, ignoreCase = true) == true
                              }
                              val cover = if (matchingImg != null) {
                                  decodeUriBitmap(matchingImg.uri) ?: generateStylizedCover(cleanTitle, ext.uppercase())
                              } else {
                                  generateStylizedCover(cleanTitle, ext.uppercase())
                              }
                              results.add(GameEntry(cleanTitle, ext.uppercase(), child.uri, cover))
                          }
                      } else if (child.isDirectory) {
                          val dirName = child.name ?: ""
                          if (!dirName.equals("content", true) && !dirName.equals("meta", true) && !dirName.startsWith(".")) {
                              scanDirectoryRecursive(child, results, depth + 1, maxDepth)
                          }
                      }
                  }
              }

              private fun parseMetaXmlTitle(metaDir: DocumentFile?): String? {
                  if (metaDir == null) return null
                  val metaXml = metaDir.listFiles().firstOrNull { it.name.equals("meta.xml", ignoreCase = true) } ?: return null
                  return try {
                      contentResolver.openInputStream(metaXml.uri)?.use { input ->
                          val parser = Xml.newPullParser()
                          parser.setInput(input, "UTF-8")
                          var event = parser.eventType
                          while (event != XmlPullParser.END_DOCUMENT) {
                              if (event == XmlPullParser.START_TAG && (parser.name == "longname_en" || parser.name == "shortname_en")) {
                                  val text = parser.nextText().trim().replace("\n", " ")
                                  if (text.isNotEmpty()) return text
                              }
                              event = parser.next()
                          }
                          null
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun loadCoverFromMeta(metaDir: DocumentFile?): Bitmap? {
                  if (metaDir == null) return null
                  val files = metaDir.listFiles()
                  val texFile = files.firstOrNull { it.name.equals("bootTvTex.png", true) }
                      ?: files.firstOrNull { it.name.equals("iconTex.png", true) }
                      ?: files.firstOrNull { it.name?.endsWith(".png", true) == true }
                  return if (texFile != null) decodeUriBitmap(texFile.uri) else null
              }

              private fun decodeUriBitmap(uri: Uri): Bitmap? {
                  return try {
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun generateStylizedCover(title: String, format: String): Bitmap {
                  val w = 360
                  val h = 230
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)

                  val hash = title.hashCode()
                  val color1 = Color.HSVToColor(floatArrayOf(((hash and 0xFF) % 360).toFloat(), 0.72f, 0.45f))
                  val color2 = Color.parseColor("#0F172A")

                  val gradPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(0f, 0f, w.toFloat(), h.toFloat(), color1, color2, Shader.TileMode.CLAMP)
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), gradPaint)

                  // Faixa superior estilo Nintendo Wii U
                  val bannerPaint = Paint().apply { color = Color.parseColor("#009AC7") }
                  canvas.drawRect(0f, 0f, w.toFloat(), 36f, bannerPaint)

                  val headerText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  canvas.drawText("Wii U  •  $format", 16f, 25f, headerText)

                  // Titulo central do jogo
                  val titlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 23f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val words = title.split(" ", "_", "-")
                  var line = ""
                  var y = 85f
                  for (word in words) {
                      val test = if (line.isEmpty()) word else "$line $word"
                      if (titlePaint.measureText(test) > w - 32f) {
                          canvas.drawText(line, 16f, y, titlePaint)
                          line = word
                          y += 30f
                          if (y > h - 20f) break
                      } else {
                          line = test
                      }
                  }
                  if (line.isNotEmpty() && y <= h - 16f) {
                      canvas.drawText(line, 16f, y, titlePaint)
                  }

                  return bmp
              }

              private fun addGameCard(game: GameEntry) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(12, 12, 12, 12)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 18f
                          setStroke(2, Color.parseColor("#334155"))
                      }
                      layoutParams = GridLayout.LayoutParams().apply {
                          width = 0
                          columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                          setMargins(10, 10, 10, 10)
                      }
                      setOnClickListener { launchGameWithShaderRecompilation(game) }
                  }

                  val coverView = ImageView(this).apply {
                      setImageDrawable(BitmapDrawable(resources, game.cover))
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 175)
                  }
                  card.addView(coverView)

                  val nameView = TextView(this).apply {
                      text = game.title
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(4, 10, 4, 2)
                  }
                  card.addView(nameView)

                  val badgeView = TextView(this).apply {
                      text = "Formato: ${game.format}"
                      textSize = 11f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setPadding(4, 0, 4, 2)
                  }
                  card.addView(badgeView)

                  gameGridContainer.addView(card)
              }

              private fun launchGameWithShaderRecompilation(game: GameEntry) {
                  val api = prefs.getInt("graphics_api", 1)
                  val resIdx = prefs.getInt("res_index", 2).coerceIn(0, resolutionValues.lastIndex)
                  val resScale = resolutionValues[resIdx]
                  val driverPath = prefs.getString("driver_path", "") ?: ""

                  NativeBridge.setGraphicsConfig(api, resScale, driverPath)

                  // Exibir tela de carregamento e recompilacao de shaders
                  launcherContainer.visibility = View.GONE
                  loadingOverlay.visibility = View.VISIBLE
                  loadingTitle.text = "Carregando ${game.title}"
                  loadingProgress.progress = 0

                  val totalPipelines = 120
                  val handler = Handler(Looper.getMainLooper())

                  thread {
                      for (step in 1..totalPipelines) {
                          Thread.sleep(16) // Simula etapa de compilacao SPIR-V / GX2
                          NativeBridge.prepareShaderCache(step, totalPipelines)
                          val pct = (step * 100) / totalPipelines
                          handler.post {
                              loadingProgress.progress = pct
                              loadingSubtitle.text = if (api == 1) {
                                  "Recompilando shaders SPIR-V (Vulkan • ${resolutionNames[resIdx]})..."
                              } else {
                                  "Compilando programas GLSL (OpenGL ES • ${resolutionNames[resIdx]})..."
                              }
                              loadingPercent.text = "$pct% ($step / $totalPipelines pipelines)"
                          }
                      }

                      handler.post {
                          loadingOverlay.visibility = View.GONE
                          openEmulationSurface(game)
                      }
                  }
              }

              private fun openEmulationSurface(game: GameEntry) {
                  val surfaceView = SurfaceView(this)
                  surfaceView.holder.addCallback(object : SurfaceHolder.Callback {
                      override fun surfaceCreated(holder: SurfaceHolder) {
                          NativeBridge.startEmulation(holder.surface, game.uri.toString())
                      }
                      override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
                      override fun surfaceDestroyed(holder: SurfaceHolder) {}
                  })

                  val gamepadOverlay = VirtualGamepadOverlay(this)

                  // Botao flutuante discreto para voltar a biblioteca
                  val exitBtn = Button(this).apply {
                      text = "⏸ Menu"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.argb(170, 15, 23, 42))
                          cornerRadius = 16f
                          setStroke(2, Color.parseColor("#38BDF8"))
                      }
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      ).apply { topMargin = 20 }
                      setOnClickListener {
                          rootLayout.removeView(surfaceView)
                          rootLayout.removeView(gamepadOverlay)
                          rootLayout.removeView(this)
                          launcherContainer.visibility = View.VISIBLE
                      }
                  }

                  rootLayout.addView(surfaceView)
                  rootLayout.addView(gamepadOverlay)
                  rootLayout.addView(exitBtn)
              }

              private fun installCustomDriver(uri: Uri) {
                  try {
                      val driversDir = File(filesDir, "custom_drivers").apply { mkdirs() }
                      var loadedSoPath = ""
                      var driverDisplayName = "Driver Customizado"

                      contentResolver.openInputStream(uri)?.use { input ->
                          val tempFile = File(cacheDir, "temp_driver_pkg")
                          FileOutputStream(tempFile).use { out -> input.copyTo(out) }

                          // Tenta extrair se for .zip (ex: Mesa Turnip)
                          var foundSo = false
                          try {
                              ZipInputStream(tempFile.inputStream()).use { zis ->
                                  var entry = zis.nextEntry
                                  while (entry != null) {
                                      if (!entry.isDirectory && entry.name.endsWith(".so")) {
                                          val outSo = File(driversDir, File(entry.name).name)
                                          FileOutputStream(outSo).use { out -> zis.copyTo(out) }
                                          loadedSoPath = outSo.absolutePath
                                          driverDisplayName = outSo.name
                                          foundSo = true
                                          break
                                      }
                                      entry = zis.nextEntry
                                  }
                              }
                          } catch (_: Exception) {}

                          if (!foundSo) {
                              val directSo = File(driversDir, "custom_gpu_driver.so")
                              tempFile.copyTo(directSo, overwrite = true)
                              loadedSoPath = directSo.absolutePath
                              driverDisplayName = "custom_gpu_driver.so"
                          }
                      }

                      prefs.edit()
                          .putString("driver_path", loadedSoPath)
                          .putString("driver_name", driverDisplayName)
                          .apply()
                      driverLabel.text = "Ativo: $driverDisplayName"
                      Toast.makeText(this, "Driver instalado: $driverDisplayName", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Erro ao importar driver: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun createStyledButton(label: String, hexColor: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 13f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(hexColor))
                          cornerRadius = 16f
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 8 }
                      setOnClickListener { onClick() }
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WiiXNative v4 APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-v4-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
