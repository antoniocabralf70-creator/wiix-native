name: Build WiiXNative APK v4 (Enhanced Scanner, D-Pad, Resolution & Shaders)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build WiiXNative APK v4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK & NDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Generate WiiXNative v4 Project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/wiixnative/app
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WiiXNative"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.wiixnative.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.wiixnative.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17 -O3"
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.documentfile:documentfile:1.0.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030002" android:required="true" />
              <uses-feature android:name="android.hardware.vulkan.level" android:version="1" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="WiiXNative"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Icone de Emulador (GamePad Wii U com tela central e botoes coloridos)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B132B"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1C2541"
                  android:pathData="M0,54 L108,0 L108,108 L0,108 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Corpo do Wii U GamePad -->
              <path
                  android:fillColor="#1E293B"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.5"
                  android:pathData="M22,32 C15,32 12,38 12,48 L12,64 C12,74 16,78 24,78 L84,78 C92,78 96,74 96,64 L96,48 C96,38 93,32 86,32 Z" />
              <!-- Tela Central -->
              <path
                  android:fillColor="#0284C7"
                  android:strokeColor="#7DD3FC"
                  android:strokeWidth="1.5"
                  android:pathData="M34,38 L74,38 L74,70 L34,70 Z" />
              <!-- Simbolo Play / Wii U na Tela -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M49,47 L62,54 L49,61 Z" />
              <!-- Analogico Esquerdo -->
              <path
                  android:fillColor="#334155"
                  android:strokeColor="#94A3B8"
                  android:strokeWidth="1.2"
                  android:pathData="M23,43 m-4.5,0 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0" />
              <!-- D-Pad Cruz -->
              <path
                  android:fillColor="#CBD5E1"
                  android:pathData="M21,54 h4 v3.5 h3.5 v4 h-3.5 v3.5 h-4 v-3.5 h-3.5 v-4 h3.5 z" />
              <!-- Analogico Direito -->
              <path
                  android:fillColor="#334155"
                  android:strokeColor="#94A3B8"
                  android:strokeWidth="1.2"
                  android:pathData="M85,43 m-4.5,0 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0" />
              <!-- Botoes A B X Y -->
              <path android:fillColor="#22C55E" android:pathData="M85,54 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0" />
              <path android:fillColor="#EF4444" android:pathData="M89,58 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0" />
              <path android:fillColor="#EAB308" android:pathData="M85,62 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0" />
              <path android:fillColor="#3B82F6" android:pathData="M81,58 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("wiixnative")

          add_library(wiixnative SHARED wiixnative.cpp)

          find_library(log-lib log)
          find_library(android-lib android)
          find_library(gles3-lib GLESv3)
          find_library(egl-lib EGL)

          target_link_libraries(wiixnative
              ${log-lib}
              ${android-lib}
              ${gles3-lib}
              ${egl-lib}
          )
          EOF

          # Ponte Nativa C++ com suporte a Resolucao Dinamica e Estado de Compilacao de Shaders
          cat << 'EOF' > app/src/main/cpp/wiixnative.cpp
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "WiiXNativeCore", __VA_ARGS__)

          static int g_graphicsApi = 1; // 0 = OpenGL ES 3.2, 1 = Vulkan 1.3
          static float g_resolutionScale = 1.0f; // 0.5x, 0.75x, 1.0x, 1.5x
          static void* g_customDriverHandle = nullptr;
          static uint32_t g_buttonMask = 0;
          static float g_leftStickX = 0.0f, g_leftStickY = 0.0f;
          static float g_rightStickX = 0.0f, g_rightStickY = 0.0f;
          static int g_compiledShaders = 0;
          static int g_totalShaders = 120;

          extern "C" JNIEXPORT void JNICALL
          Java_com_wiixnative_app_NativeBridge_setGraphicsConfig(
                  JNIEnv* env, jobject, jint apiId, jfloat resScale, jstring driverPath) {
              g_graphicsApi = apiId;
              g_resolutionScale = resScale;
              const char* path = env->GetStringUTFChars(driverPath, nullptr);
              if (path && strlen(path) > 0) {
                  if (g_customDriverHandle) dlclose(g_customDriverHandle);
                  g_customDriverHandle = dlopen(path, RTLD_NOW | RTLD_LOCAL);
                  LOGI("Driver personalizado carregado: %s (handle=%p)", path, g_customDriverHandle);
              }
              env->ReleaseStringUTFChars(driverPath, path);
              LOGI("Config aplicada -> API: %d | Resolucao: %.2fx", g_graphicsApi, g_resolutionScale);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_wiixnative_app_NativeBridge_prepareShaderCache(JNIEnv*, jobject, jint step, jint total) {
              g_compiledShaders = step;
              g_totalShaders = total;
              LOGI("Recompilando shaders/pipelines: %d / %d", g_compiledShaders, g_totalShaders);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_wiixnative_app_NativeBridge_startEmulation(
                  JNIEnv* env, jobject, jobject surface, jstring gameUri) {
              ANativeWindow* window = ANativeWindow_fromSurface(env, surface);
              const char* uri = env->GetStringUTFChars(gameUri, nullptr);
              if (window) {
                  int baseW = ANativeWindow_getWidth(window);
                  int baseH = ANativeWindow_getHeight(window);
                  int scaledW = static_cast<int>(baseW * g_resolutionScale);
                  int scaledH = static_cast<int>(baseH * g_resolutionScale);
                  ANativeWindow_setBuffersGeometry(window, scaledW, scaledH, WINDOW_FORMAT_RGBA_8888);
                  LOGI("Iniciando jogo: %s | Viewport escalonado: %dx%d (%.2fx)", uri, scaledW, scaledH, g_resolutionScale);
                  ANativeWindow_release(window);
              }
              env->ReleaseStringUTFChars(gameUri, uri);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_wiixnative_app_NativeBridge_updateInput(
                  JNIEnv*, jobject, jint buttonMask, jfloat lx, jfloat ly, jfloat rx, jfloat ry) {
              g_buttonMask = static_cast<uint32_t>(buttonMask);
              g_leftStickX = lx;
              g_leftStickY = ly;
              g_rightStickX = rx;
              g_rightStickY = ry;
          }
          EOF

          # NativeBridge.kt
          cat << 'EOF' > app/src/main/java/com/wiixnative/app/NativeBridge.kt
          package com.wiixnative.app

          import android.view.Surface

          object NativeBridge {
              init {
                  System.loadLibrary("wiixnative")
              }

              external fun setGraphicsConfig(apiId: Int, resScale: Float, driverPath: String)
              external fun prepareShaderCache(step: Int, total: Int)
              external fun startEmulation(surface: Surface, gameUri: String)
              external fun updateInput(buttonMask: Int, lx: Float, ly: Float, rx: Float, ry: Float)
          }
          EOF

          # VirtualGamepadOverlay.kt - Controles maiores + D-Pad cruzado interativo
          cat << 'EOF' > app/src/main/java/com/wiixnative/app/VirtualGamepadOverlay.kt
          package com.wiixnative.app

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin

          class VirtualGamepadOverlay @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {

              companion object {
                  const val BTN_A = 1 shl 0
                  const val BTN_B = 1 shl 1
                  const val BTN_X = 1 shl 2
                  const val BTN_Y = 1 shl 3
                  const val BTN_L = 1 shl 4
                  const val BTN_R = 1 shl 5
                  const val BTN_ZL = 1 shl 6
                  const val BTN_ZR = 1 shl 7
                  const val BTN_PLUS = 1 shl 8
                  const val BTN_MINUS = 1 shl 9
                  const val DPAD_UP = 1 shl 10
                  const val DPAD_DOWN = 1 shl 11
                  const val DPAD_LEFT = 1 shl 12
                  const val DPAD_RIGHT = 1 shl 13
              }

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(115, 15, 23, 42)
                  style = Paint.Style.FILL
              }
              private val pressedPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(195, 14, 165, 233)
                  style = Paint.Style.FILL
              }
              private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(200, 56, 189, 248)
                  style = Paint.Style.STROKE
                  strokeWidth = 4.5f
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
              }

              private data class ControlButton(
                  val label: String,
                  val mask: Int,
                  val rect: RectF,
                  val isCircle: Boolean = true,
                  val accentColor: Int = Color.TRANSPARENT
              )

              private val buttons = mutableListOf<ControlButton>()
              private var leftStickCenter = PointF()
              private var rightStickCenter = PointF()
              private var leftStickKnob = PointF()
              private var rightStickKnob = PointF()
              private var stickRadius = 115f
              private var dpadCenter = PointF()
              private var dpadArm = 68f

              private var leftPointerId = -1
              private var rightPointerId = -1
              private var currentMask = 0
              private var lx = 0f
              private var ly = 0f
              private var rx = 0f
              private var ry = 0f

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  buttons.clear()

                  val scale = (h / 1080f).coerceIn(0.85f, 1.45f)
                  stickRadius = 115f * scale
                  dpadArm = 72f * scale
                  val btnR = 56f * scale

                  // Analogicos grandes na parte superior (estilo Wii U GamePad)
                  leftStickCenter.set(170f * scale, h * 0.36f)
                  leftStickKnob.set(leftStickCenter.x, leftStickCenter.y)

                  rightStickCenter.set(w - 170f * scale, h * 0.36f)
                  rightStickKnob.set(rightStickCenter.x, rightStickCenter.y)

                  // D-Pad em cruz grande no canto inferior esquerdo
                  dpadCenter.set(205f * scale, h * 0.72f)
                  buttons.add(ControlButton("▲", DPAD_UP, RectF(dpadCenter.x - dpadArm * 0.65f, dpadCenter.y - dpadArm * 1.85f, dpadCenter.x + dpadArm * 0.65f, dpadCenter.y - dpadArm * 0.55f), false))
                  buttons.add(ControlButton("▼", DPAD_DOWN, RectF(dpadCenter.x - dpadArm * 0.65f, dpadCenter.y + dpadArm * 0.55f, dpadCenter.x + dpadArm * 0.65f, dpadCenter.y + dpadArm * 1.85f), false))
                  buttons.add(ControlButton("◀", DPAD_LEFT, RectF(dpadCenter.x - dpadArm * 1.85f, dpadCenter.y - dpadArm * 0.65f, dpadCenter.x - dpadArm * 0.55f, dpadCenter.y + dpadArm * 0.65f), false))
                  buttons.add(ControlButton("▶", DPAD_RIGHT, RectF(dpadCenter.x + dpadArm * 0.55f, dpadCenter.y - dpadArm * 0.65f, dpadCenter.x + dpadArm * 1.85f, dpadCenter.y + dpadArm * 0.65f), false))

                  // Botoes A B X Y grandes no canto inferior direito
                  val abxyX = w - 210f * scale
                  val abxyY = h * 0.72f
                  val spread = 96f * scale
                  buttons.add(ControlButton("X", BTN_X, RectF(abxyX - btnR, abxyY - spread - btnR, abxyX + btnR, abxyY - spread + btnR), true, Color.argb(90, 59, 130, 246)))
                  buttons.add(ControlButton("B", BTN_B, RectF(abxyX - btnR, abxyY + spread - btnR, abxyX + btnR, abxyY + spread + btnR), true, Color.argb(90, 234, 179, 8)))
                  buttons.add(ControlButton("Y", BTN_Y, RectF(abxyX - spread - btnR, abxyY - btnR, abxyX - spread + btnR, abxyY + btnR), true, Color.argb(90, 34, 197, 94)))
                  buttons.add(ControlButton("A", BTN_A, RectF(abxyX + spread - btnR, abxyY - btnR, abxyX + spread + btnR, abxyY + btnR), true, Color.argb(90, 239, 68, 68)))

                  // Gatilhos superiores L / ZL e R / ZR grandes
                  val topW = 140f * scale
                  val topH = 66f * scale
                  buttons.add(ControlButton("ZL", BTN_ZL, RectF(32f * scale, 24f * scale, 32f * scale + topW, 24f * scale + topH), false))
                  buttons.add(ControlButton("L", BTN_L, RectF(48f * scale + topW, 24f * scale, 48f * scale + topW * 2, 24f * scale + topH), false))

                  buttons.add(ControlButton("R", BTN_R, RectF(w - 48f * scale - topW * 2, 24f * scale, w - 48f * scale - topW, 24f * scale + topH), false))
                  buttons.add(ControlButton("ZR", BTN_ZR, RectF(w - 32f * scale - topW, 24f * scale, w - 32f * scale, 24f * scale + topH), false))

                  // Botoes + e - na parte inferior central
                  val sysR = 46f * scale
                  buttons.add(ControlButton("-", BTN_MINUS, RectF(w * 0.42f - sysR, h - 105f * scale, w * 0.42f + sysR, h - 105f * scale + sysR * 1.5f), true))
                  buttons.add(ControlButton("+", BTN_PLUS, RectF(w * 0.58f - sysR, h - 105f * scale, w * 0.58f + sysR, h - 105f * scale + sysR * 1.5f), true))
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  // Base central do D-Pad para visual de cruz unica
                  canvas.drawRect(
                      dpadCenter.x - dpadArm * 0.65f,
                      dpadCenter.y - dpadArm * 0.65f,
                      dpadCenter.x + dpadArm * 0.65f,
                      dpadCenter.y + dpadArm * 0.65f,
                      bgPaint
                  )

                  // Desenhar botoes
                  for (btn in buttons) {
                      val isPressed = (currentMask and btn.mask) != 0
                      val fill = if (isPressed) pressedPaint else bgPaint
                      if (btn.isCircle) {
                          canvas.drawOval(btn.rect, fill)
                          if (btn.accentColor != Color.TRANSPARENT && !isPressed) {
                              val accent = Paint(fill).apply { color = btn.accentColor }
                              canvas.drawOval(btn.rect, accent)
                          }
                          canvas.drawOval(btn.rect, strokePaint)
                      } else {
                          canvas.drawRoundRect(btn.rect, 20f, 20f, fill)
                          canvas.drawRoundRect(btn.rect, 20f, 20f, strokePaint)
                      }
                      textPaint.textSize = btn.rect.height() * 0.44f
                      val yPos = btn.rect.centerY() - (textPaint.descent() + textPaint.ascent()) / 2f
                      canvas.drawText(btn.label, btn.rect.centerX(), yPos, textPaint)
                  }

                  // Analogico Esquerdo
                  canvas.drawCircle(leftStickCenter.x, leftStickCenter.y, stickRadius, bgPaint)
                  canvas.drawCircle(leftStickCenter.x, leftStickCenter.y, stickRadius, strokePaint)
                  canvas.drawCircle(leftStickKnob.x, leftStickKnob.y, stickRadius * 0.48f, pressedPaint)
                  canvas.drawCircle(leftStickKnob.x, leftStickKnob.y, stickRadius * 0.48f, strokePaint)

                  // Analogico Direito
                  canvas.drawCircle(rightStickCenter.x, rightStickCenter.y, stickRadius, bgPaint)
                  canvas.drawCircle(rightStickCenter.x, rightStickCenter.y, stickRadius, strokePaint)
                  canvas.drawCircle(rightStickKnob.x, rightStickKnob.y, stickRadius * 0.48f, pressedPaint)
                  canvas.drawCircle(rightStickKnob.x, rightStickKnob.y, stickRadius * 0.48f, strokePaint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val action = event.actionMasked
                  val actionIndex = event.actionIndex
                  val pointerId = event.getPointerId(actionIndex)

                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {
                      val x = event.getX(actionIndex)
                      val y = event.getY(actionIndex)
                      if (leftPointerId == -1 && hypot(x - leftStickCenter.x, y - leftStickCenter.y) <= stickRadius * 1.35f) {
                          leftPointerId = pointerId
                      } else if (rightPointerId == -1 && hypot(x - rightStickCenter.x, y - rightStickCenter.y) <= stickRadius * 1.35f) {
                          rightPointerId = pointerId
                      }
                  }

                  if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP || action == MotionEvent.ACTION_CANCEL) {
                      if (pointerId == leftPointerId) {
                          leftPointerId = -1
                          leftStickKnob.set(leftStickCenter.x, leftStickCenter.y)
                          lx = 0f; ly = 0f
                      }
                      if (pointerId == rightPointerId) {
                          rightPointerId = -1
                          rightStickKnob.set(rightStickCenter.x, rightStickCenter.y)
                          rx = 0f; ry = 0f
                      }
                  }

                  var newMask = 0
                  for (i in 0 until event.pointerCount) {
                      val id = event.getPointerId(i)
                      if ((action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP) && i == actionIndex) continue
                      val px = event.getX(i)
                      val py = event.getY(i)

                      if (id == leftPointerId) {
                          val dx = px - leftStickCenter.x
                          val dy = py - leftStickCenter.y
                          val dist = hypot(dx, dy).coerceAtMost(stickRadius)
                          val angle = atan2(dy, dx)
                          leftStickKnob.set(leftStickCenter.x + cos(angle) * dist, leftStickCenter.y + sin(angle) * dist)
                          lx = (cos(angle) * dist) / stickRadius
                          ly = (sin(angle) * dist) / stickRadius
                      } else if (id == rightPointerId) {
                          val dx = px - rightStickCenter.x
                          val dy = py - rightStickCenter.y
                          val dist = hypot(dx, dy).coerceAtMost(stickRadius)
                          val angle = atan2(dy, dx)
                          rightStickKnob.set(rightStickCenter.x + cos(angle) * dist, rightStickCenter.y + sin(angle) * dist)
                          rx = (cos(angle) * dist) / stickRadius
                          ry = (sin(angle) * dist) / stickRadius
                      } else {
                          // Area expandida de toque para facilitar uso em telas menores
                          for (btn in buttons) {
                              val hitRect = RectF(btn.rect).apply { inset(-14f, -14f) }
                              if (hitRect.contains(px, py)) {
                                  newMask = newMask or btn.mask
                              }
                          }
                      }
                  }

                  currentMask = newMask
                  NativeBridge.updateInput(currentMask, lx, ly, rx, ry)
                  invalidate()
                  return true
              }
          }
          EOF

          # MainActivity.kt - Scanner Recursivo Profundo + Resolucao + Tela de Recompilacao de Shaders
