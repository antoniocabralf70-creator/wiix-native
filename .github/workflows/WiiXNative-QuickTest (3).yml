name: WiiXNative Build (Quick Test + Núcleo Super Otimizado)

on:
  workflow_dispatch:
    inputs:
      cpu_profile:
        description: "Perfil de CPU (MediaTek)"
        type: choice
        default: armv82
        options:
          - armv82
          - armv8
      fast_math:
        description: "Usar -ffast-math (mais rápido, pode causar bugs de float no PPC)"
        type: boolean
        default: false
      build_core:
        description: "Compilar o núcleo após o teste rápido"
        type: boolean
        default: true
  push:
    branches: [main, master]

concurrency:
  group: wiixnative-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  ANDROID_API: "34"
  CEMU_REPO: "https://github.com/Producdevity/Cemu-Android.git"

jobs:
  quick-test:
    name: Quick Test (SDK, NDK e flags)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cflags: ${{ steps.flags.outputs.cflags }}
      ldflags: ${{ steps.flags.outputs.ldflags }}

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes | "$SDKM" --licenses >/dev/null; } || true
          "$SDKM" --install "platform-tools" "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_API}.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verificar repositório do Cemu Android
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote "$CEMU_REPO" HEAD

      - name: Definir flags de otimização máxima
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.cpu_profile || 'armv82' }}"
          FAST="${{ github.event.inputs.fast_math || 'false' }}"
          if [ "$PROFILE" = "armv82" ]; then
            ARCH="-march=armv8.2-a+dotprod+fp16+crypto -mtune=cortex-a76"
          else
            ARCH="-march=armv8-a+crc+crypto -mtune=cortex-a55"
          fi
          C="-O3 $ARCH -DNDEBUG -fomit-frame-pointer -fno-semantic-interposition"
          C="$C -fvisibility=hidden -ffunction-sections -fdata-sections -flto=thin"
          [ "$FAST" = "true" ] && C="$C -ffast-math"
          L="-flto=thin -Wl,--gc-sections -Wl,-O2 -Wl,--icf=all"
          echo "cflags=$C" >> "$GITHUB_OUTPUT"
          echo "ldflags=$L" >> "$GITHUB_OUTPUT"
          echo "CFLAGS: $C"; echo "LDFLAGS: $L"

      - name: Testar compilação e link com as flags
        shell: bash
        run: |
          set -euo pipefail
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          printf '#include <iostream>\nint main(){std::cout<<"WiiXNative OK"<<std::endl;return 0;}\n' > t.cpp
          # shellcheck disable=SC2086
          "$CLANG" ${{ steps.flags.outputs.cflags }} ${{ steps.flags.outputs.ldflags }} t.cpp -o t
          file t

  build-core:
    name: Núcleo Super Otimizado (arm64-v8a)
    needs: quick-test
    if: ${{ github.event_name == 'push' || github.event.inputs.build_core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Liberar espaço em disco
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/2[0-5]* || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes | "$SDKM" --licenses >/dev/null; } || true
          "$SDKM" --install "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_API}.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache ninja-build

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: wiixnative-${{ runner.os }}-${{ github.run_id }}
          restore-keys: wiixnative-${{ runner.os }}-

      - name: Baixar código do Cemu Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          git clone --depth 1 "$CEMU_REPO" cemu-android
          cd cemu-android
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          echo "=== Estrutura ==="
          ls -la
          find . -maxdepth 3 \( -name "gradlew" -o -name "CMakeLists.txt" -o -name "build.gradle*" -o -name "settings.gradle*" \) -not -path "*/externals/*" | head -40

      - name: Injetar flags otimizadas no Gradle (init script)
        shell: bash
        env:
          CF: ${{ needs.quick-test.outputs.cflags }}
          LF: ${{ needs.quick-test.outputs.ldflags }}
        run: |
          set -euo pipefail
          cat > "$HOME/opt-init.gradle" << INITGRADLE
          allprojects {
            plugins.withId('com.android.application') { configureOpt(it) }
            plugins.withId('com.android.library') { configureOpt(it) }
          }
          def configureOpt(p) {
            project.android.defaultConfig {
              ndk { abiFilters 'arm64-v8a' }
              externalNativeBuild {
                cmake {
                  cFlags "$CF"
                  cppFlags "$CF"
                  arguments "-DCMAKE_BUILD_TYPE=Release",
                            "-DCMAKE_SHARED_LINKER_FLAGS=$LF",
                            "-DCMAKE_EXE_LINKER_FLAGS=$LF",
                            "-DANDROID_STL=c++_shared"
                }
              }
            }
          }
          INITGRADLE
          cat "$HOME/opt-init.gradle"

      - name: Compilar núcleo + APK
        working-directory: cemu-android
        shell: bash
        env:
          CFLAGS: ${{ needs.quick-test.outputs.cflags }}
          CXXFLAGS: ${{ needs.quick-test.outputs.cflags }}
          LDFLAGS: ${{ needs.quick-test.outputs.ldflags }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_GENERATOR: Ninja
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease -I "$HOME/opt-init.gradle" \
            --no-daemon --stacktrace --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Resumo do erro (aparece na página da execução)
        if: failure()
        shell: bash
        run: |
          {
            echo "### Últimas linhas do build"
            echo '```'
            grep -nE "error:|FAILED|What went wrong|Exception|undefined reference" logs/build.log | head -30 || true
            echo '---'
            tail -n 40 logs/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Coletar APK e libs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find cemu-android -name "*.apk" -path "*outputs*" -exec cp -v {} out/ \;
          find cemu-android -name "*.so" -path "*arm64-v8a*" -path "*build*" -exec cp -v {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-mtk-${{ github.event.inputs.cpu_profile || 'armv82' }}
          path: out/
          if-no-files-found: error
          retention-days: 14
